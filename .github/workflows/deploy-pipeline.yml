on:
  push:
    branches:
      - dev
      - test
      - prod

jobs:
  build-dev:
    name: Build Dev Image
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        run: |
          DOCKER_REGISTRY="${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com"
          docker login --username AWS --password-stdin $DOCKER_REGISTRY <<< $(aws ecr get-login-password --region ${{ secrets.AWS_REGION }})

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push dev image
        env:
          DOCKER_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com
          IMAGE_NAME: ${{ vars.IMAGE_NAME_PREFIX }}/${{ vars.IMAGE_NAME_BASE }}
          SERVICE_DIR: ${{ vars.SERVICE_DIR }}
          CLUSTER_NAME: ${{ vars.CLUSTER_NAME }}
          SERVICE_NAME: ${{ vars.SERVICE_NAME }}
        run: |
          docker buildx build --platform linux/amd64 \
            --push \
            -t $DOCKER_REGISTRY/$IMAGE_NAME \
            $SERVICE_DIR
          aws ecs update-service --cluster $CLUSTER_NAME --service $SERVICE_NAME --force-new-deployment

  build-test:
    name: Build Test Image
    if: github.ref == 'refs/heads/test'
    runs-on: ubuntu-latest
    environment: test
    steps:
      - uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        run: |
          DOCKER_REGISTRY="${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com"
          docker login --username AWS --password-stdin $DOCKER_REGISTRY <<< $(aws ecr get-login-password --region ${{ secrets.AWS_REGION }})

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push test image
        env:
          DOCKER_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com
          IMAGE_NAME: ${{ vars.IMAGE_NAME_PREFIX }}/${{ vars.IMAGE_NAME_BASE }}
          SERVICE_DIR: ${{ vars.SERVICE_DIR }}
          CLUSTER_NAME: ${{ vars.CLUSTER_NAME }}
          SERVICE_NAME: ${{ vars.SERVICE_NAME }}
        run: |
          docker buildx build --platform linux/amd64 \
            --push \
            -t $DOCKER_REGISTRY/$IMAGE_NAME \
            $SERVICE_DIR
          aws ecs update-service --cluster $CLUSTER_NAME --service $SERVICE_NAME --force-new-deployment

  build-prod:
    name: Build Prod Image
    if: github.ref == 'refs/heads/prod'
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        run: |
          DOCKER_REGISTRY="${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com"
          docker login --username AWS --password-stdin $DOCKER_REGISTRY <<< $(aws ecr get-login-password --region ${{ secrets.AWS_REGION }})

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push prod image
        env:
          DOCKER_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com
          IMAGE_NAME: ${{ vars.IMAGE_NAME_PREFIX }}/${{ vars.IMAGE_NAME_BASE }}
          SERVICE_DIR: ${{ vars.SERVICE_DIR }}
          CLUSTER_NAME: ${{ vars.CLUSTER_NAME }}
          SERVICE_NAME: ${{ vars.SERVICE_NAME }}
        run: |
          docker buildx build --platform linux/amd64 \
            --push \
            -t $DOCKER_REGISTRY/$IMAGE_NAME \
            $SERVICE_DIR
          aws ecs update-service --cluster $CLUSTER_NAME --service $SERVICE_NAME --force-new-deployment
